<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Supplier Onboarding Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6fa; margin: 0; padding: 32px; color: #1a1a2e; }
    h1 { margin: 0 0 24px; }
    .kpis { display: flex; gap: 16px; margin-bottom: 32px; }
    .kpi { background: white; border-radius: 12px; padding: 20px 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); flex: 1; }
    .kpi .label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .kpi .value { font-size: 28px; font-weight: 700; }
    .kpi.overdue .value { color: #dc2626; }
    .kpi.due-soon .value { color: #d97706; }
    .main { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
    .flag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .flag-Overdue { background: #fee2e2; color: #dc2626; }
    .flag-Due.Soon, .flag-DueSoon { background: #fef3c7; color: #d97706; }
    .flag-On.Track, .flag-OnTrack { background: #dbeafe; color: #2563eb; }
    .flag-Done { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>
  <h1>Supplier Onboarding Tracker</h1>

  <div class="kpis">
    <div class="kpi overdue"><div class="label">Overdue</div><div class="value">{{ overdue_count }}</div></div>
    <div class="kpi due-soon"><div class="label">Due Soon</div><div class="value">{{ due_soon_count }}</div></div>
    <div class="kpi"><div class="label">On Track</div><div class="value">{{ on_track_count }}</div></div>
    <div class="kpi"><div class="label">Done</div><div class="value">{{ done_count }}</div></div>
  </div>

  <div class="main">
    <div class="card">
      <canvas id="byOwner"></canvas>
    </div>
    <div class="card" style="overflow-x: auto;">
      <table>
        <thead><tr><th>Supplier</th><th>Owner</th><th>Stage</th><th>Due</th><th>Flag</th></tr></thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td>{{ r.supplier }}</td>
            <td>{{ r.owner }}</td>
            <td>{{ r.stage }}</td>
            <td>{{ r.due_date }}</td>
            <td><span class="flag flag-{{ r.flag | replace(' ', '') }}">{{ r.flag }}</span></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <script>
    new Chart(document.getElementById('byOwner'), {
      type: 'bar',
      data: {
        labels: {{ owner_labels | tojson }},
        datasets: [{ label: 'Items by owner', data: {{ owner_values | tojson }}, backgroundColor: '#4f46e5' }]
      }
    });
  </script>
</body>
</html>
