<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Sales Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6fa; margin: 0; padding: 32px; color: #1a1a2e; }
    h1 { margin: 0 0 24px; }
    .kpis { display: flex; gap: 16px; margin-bottom: 32px; }
    .kpi { background: white; border-radius: 12px; padding: 20px 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); flex: 1; }
    .kpi .label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .kpi .value { font-size: 28px; font-weight: 700; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .toolbar { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 24px; }
    .toolbar label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 4px; }
    .toolbar input[type=date] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    .toolbar button, .toolbar a.export {
      padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
      text-decoration: none; display: inline-block;
    }
    .toolbar button { background: #4f46e5; color: white; }
    .toolbar a.export { background: #047857; color: white; }
  </style>
</head>
<body>
  <h1>Sales Dashboard</h1>

  <form class="toolbar" method="get">
    <div><label>From</label><input type="date" name="start" value="{{ start }}"></div>
    <div><label>To</label><input type="date" name="end" value="{{ end }}"></div>
    <button type="submit">Apply filter</button>
    <a class="export" href="/export.csv?start={{ start }}&end={{ end }}">Export CSV</a>
  </form>

  <div class="kpis">
    <div class="kpi"><div class="label">Total Revenue</div><div class="value">฿{{ total_revenue }}</div></div>
    <div class="kpi"><div class="label">Total Orders</div><div class="value">{{ total_orders }}</div></div>
    <div class="kpi"><div class="label">Avg Order Value</div><div class="value">฿{{ avg_order }}</div></div>
  </div>

  <div class="charts">
    <div class="card">
      <canvas id="bySource"></canvas>
    </div>
    <div class="card">
      <canvas id="byDay"></canvas>
    </div>
  </div>

  <script>
    new Chart(document.getElementById('bySource'), {
      type: 'bar',
      data: {
        labels: {{ source_labels | tojson }},
        datasets: [{ label: 'Revenue by source', data: {{ source_values | tojson }}, backgroundColor: '#4f46e5' }]
      }
    });
    new Chart(document.getElementById('byDay'), {
      type: 'line',
      data: {
        labels: {{ day_labels | tojson }},
        datasets: [{ label: 'Revenue by day', data: {{ day_values | tojson }}, borderColor: '#10b981', tension: 0.3 }]
      }
    });
  </script>
</body>
</html>
